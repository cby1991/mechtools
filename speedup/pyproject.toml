[project]
name = "speedup"
version = "0.1.0"
description = "Manufacturing workshop toolkit: BOM picking-list generation and file matching/copying. Pure Python, no bat / PowerShell."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "cby", email = "boyang_chen@163.com" }]
keywords = ["manufacturing", "step", "bom", "excel", "automation"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.4",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
#: 轴测图渲染（`gbbuild --with-image`）。
#:
#: 刻意**不放进主依赖**：cadquery 会捎带 OCP / vtk / numpy / scipy / numba / trame，
#: 装一次 4 分多钟、几百 MB。没装的人照样能用其它所有功能 —— `thumb.py` 会优雅降级
#: （`is_available()` 返回 False，渲染返回带 error 的结果，不抛异常）。
images = ["cadquery>=2.4"]

[project.scripts]
speedup = "speedup.cli:main"

[project.urls]
Homepage = "https://github.com/cby1991/mechtools/tree/main/speedup"
Source = "https://github.com/cby1991/mechtools/tree/main/speedup"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speedup"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "gui: 需要图形界面的测试（默认不跳过，仅在无 tkinter 时自行跳过）",
    "slow: 较慢的测试",
]

[tool.coverage.run]
source = ["src/speedup"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.uv]
package = true
